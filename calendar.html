<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Planner | Takvim</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://kit.fontawesome.com/b07e19239f.js"></script>
</head>

<body>


    <div class="container">


        <div class="sidebar">

            <h2>Event Planner</h2>

            <ul>

                <li>
                    <i class="fa-solid fa-house fa-xl fa-width-auto"></i>Kontrol Paneli
                </li>

                <li>
                    <i class="fa-solid fa-list-ul fa-xl fa-width-auto"></i>Etkinlikler
                </li>

                <li>
                    <i class="fa-solid fa-calendar fa-xl fa-width-auto"></i>Takvim
                </li>

                <li>
                    <i class="fa-solid fa-gear fa-xl fa-width-auto"></i>Ayarlar
                </li>

                <li>
                    <i class="fa-solid fa-right-from-bracket fa-xl fa-width-auto"></i>Çıkış Yap
                </li>

            </ul>

        </div>








        <div class="calendar">



            <div class="calendar-header">

                <button>
                    <i class="fa-solid fa-chevron-left"></i>
                </button>

                <h2>Eylül 2026</h2>

                <button>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

            </div>











            <div class="event-list">

                <div class="calendar-event ">

                    <div class="event-date">
                        <strong>02</strong>
                        <span>Eylül</span>
                    </div>



                    <h3>Yazılım Semineri</h3>

                    <div class="event-details">
                        <span>
                            <i class="fa-solid fa-clock"></i>
                            12.00
                        </span>

                        <span>
                            <i class="fa-solid fa-location-dot"></i>
                            Ankara
                        </span>
                    </div>



                </div>


                <div class="calendar-event ">

                    <div class="event-date">
                        <strong>04</strong>
                        <span>Eylül</span>
                    </div>



                    <h3>Fotoğraf Workshop</h3>

                    <div class="event-details">
                        <span>
                            <i class="fa-solid fa-clock"></i>
                            12.30
                        </span>

                        <span>
                            <i class="fa-solid fa-location-dot"></i>
                            İstanbul
                        </span>
                    </div>



                </div>





                <div class="calendar-event ">

                    <div class="event-date">
                        <strong>15</strong>
                        <span>Eylül</span>
                    </div>



                    <h3>Pazarlama Zirvesi</h3>

                    <div class="event-details">
                        <span>
                            <i class="fa-solid fa-clock"></i>
                            09.00
                        </span>

                        <span>
                            <i class="fa-solid fa-location-dot"></i>
                            İstanbul
                        </span>
                    </div>



                </div>

            </div>



        </div>








    </div>
    <script src="js/app.js"></script>
</body>

</html>

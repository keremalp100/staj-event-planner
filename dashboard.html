<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Planner | Kontrol Paneli</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://kit.fontawesome.com/b07e19239f.js"></script>

</head>

<body>
    <div class="container">


        <div class="sidebar">

            <h2>Event Planner</h2>

            <ul>

                <li>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-house fa-xl fa-width-auto"></i>Kontrol Paneli
                    </a>
                </li>

                <li>
                    <a href="events.html">
                        <i class="fa-solid fa-list-ul fa-xl fa-width-auto"></i>Etkinlikler
                    </a>
                </li>

                <li>
                    <a href="calendar.html">
                        <i class="fa-solid fa-calendar fa-xl fa-width-auto"></i>Takvim
                    </a>
                </li>

                <li>
                    <a href="settings.html">
                        <i class="fa-solid fa-gear fa-xl fa-width-auto"></i>Ayarlar
                    </a>
                </li>

                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-right-from-bracket fa-xl fa-width-auto"></i>Çıkış Yap
                    </a>
                </li>

            </ul>

        </div>


        <div class="dashboard">

            <h2>Kontrol Paneli</h2>


            <div class="cards">

                <div class="card1">

                    <p></p>

                    <h2>Toplam Etkinlik</h2>

                </div>

                <div class="card2">

                    <p></p>

                    <h2>Yaklaşan Etkinlik</h2>

                </div>

                <div class="card3">

                    <p></p>

                    <h2>Tamamlanan Etkinlik</h2>

                </div>

            </div>


            <div class="upcoming-events">

                <h2>Yaklaşan Etkinlikler</h2>

                <table>

                    <thead>

                        <tr>
                            <th>Etkinlik Adı</th>
                            <th><i class="fa-solid fa-calendar"></i> Tarih</th>
                            <th><i class="fa-solid fa-clock"></i> Saat</th>
                            <th><i class="fa-solid fa-location-dot"></i> Konum</th>
                        </tr>

                    </thead>

                    <tbody>
                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
